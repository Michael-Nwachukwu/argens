<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:#0C0B0A; }
  body { font-family:"DM Sans",sans-serif; position:relative; }

  .panel { position:absolute; left:0; right:0; height:675px; overflow:hidden; }
  #before { top:0; background:#191012; }
  #before .tex { position:absolute; inset:0;
    background-image: radial-gradient(rgba(120,60,60,0.22) 1.4px, transparent 1.4px);
    background-size: 34px 34px; }
  #after { bottom:0; background:#C5A253; }
  #after .tex { position:absolute; inset:0;
    background-image:
      radial-gradient(rgba(122,98,48,0.22) 1.8px, transparent 1.8px),
      repeating-linear-gradient(45deg, rgba(143,116,55,0.10) 0 2px, transparent 2px 16px);
    background-size: 28px 28px, auto; }

  .tag { position:absolute; left:84px; top:64px; font-family:"JetBrains Mono",monospace;
    font-weight:600; font-size:24px; letter-spacing:0.3em; text-transform:uppercase;
    padding:14px 26px; border-radius:999px; }
  #before .tag { color:#E08573; border:3px solid #6E3328; }
  #after .tag { color:#241B07; border:3px solid #8F7437; }

  .cap { position:absolute; left:84px; top:150px; width:600px;
    font-size:56px; font-weight:700; letter-spacing:-0.02em; line-height:1.18; }
  #before .cap { color:#EDE0DC; }
  #before .cap .r { color:#E08573; }
  #after .cap { color:#241B07; }

  /* ground lines */
  .ground { position:absolute; left:0; right:0; bottom:118px; height:5px; }
  #before .ground { background:#3A2226; }
  #after .ground { background:#8F7437; }

  /* the wall */
  #wall { position:absolute; right:120px; bottom:123px; width:300px; height:330px;
    background:#2A1A1E;
    background-image:
      linear-gradient(rgba(224,133,115,0.16) 4px, transparent 4px),
      linear-gradient(90deg, rgba(224,133,115,0.16) 4px, transparent 4px);
    background-size: 100px 56px;
    border-radius:8px 8px 0 0; border:4px solid #45272D; border-bottom:none; }
  #wallsign { position:absolute; right:142px; bottom:300px; transform:rotate(-3deg);
    background:#1F1416; border:4px solid #B4452F; border-radius:14px; padding:20px 26px;
    font-family:"JetBrains Mono",monospace; text-align:center; z-index:3; }
  #wallsign .code { font-size:52px; font-weight:600; color:#E08573; }
  #wallsign .msg { margin-top:6px; font-size:21px; letter-spacing:0.08em; color:#9C6F66; }

  /* dashed halted progress */
  #halt { position:absolute; left:84px; bottom:200px; }

  .masc { position:absolute; }

  /* after: gate + coins trail */
  #gate { position:absolute; left:430px; bottom:123px; }
  .coin-t { position:absolute; border-radius:50%; background:#F0E0AC; border:4px solid #B59243; }
  #aftpath { position:absolute; left:84px; bottom:196px; }

  /* center divider chevron */
  #div { position:absolute; left:0; right:0; top:649px; height:52px; z-index:5; display:flex;
    align-items:center; justify-content:center; }
  #div .line { position:absolute; left:0; right:0; top:24px; height:5px; background:#0C0B0A; }
  #div .chip { position:relative; background:#0C0B0A; border-radius:999px; padding:10px 30px;
    display:flex; align-items:center; gap:14px; }
  #div .chip svg { display:block; }
  #div .chip span { font-family:"JetBrains Mono",monospace; font-size:21px; color:#C5A253;
    letter-spacing:0.18em; text-transform:uppercase; }

  #grain { position:absolute; inset:0; z-index:9; pointer-events:none; }
</style>
</head>
<body>
  <!-- BEFORE -->
  <div id="before" class="panel">
    <div class="tex"></div>
    <div class="tag">before argens</div>
    <div class="cap">Stops at every <span class="r">paywall.</span></div>

    <div id="halt">
      <svg width="430" height="40" viewBox="0 0 430 40">
        <line x1="0" y1="20" x2="350" y2="20" stroke="#6E3328" stroke-width="6" stroke-dasharray="26 18" stroke-linecap="round"/>
        <line x1="384" y1="2" x2="384" y2="38" stroke="#B4452F" stroke-width="8" stroke-linecap="round"/>
        <line x1="406" y1="2" x2="406" y2="38" stroke="#B4452F" stroke-width="8" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="wall"></div>
    <div id="wallsign">
      <div class="code">402</div>
      <div class="msg">PAYMENT REQUIRED</div>
    </div>

    <!-- mascot stopped, facing wall, sweat drop -->
    <div class="masc" style="right:452px; bottom:123px;">
      <svg width="108" height="125" viewBox="0 0 91 105">
        <g transform="translate(21,77)"><rect width="14" height="14" fill="#3E4346"/><rect y="14" width="14" height="7" fill="#B0623A"/><rect x="-7" y="21" width="21" height="7" fill="#3E4346"/></g>
        <g transform="translate(49,77)"><rect width="14" height="14" fill="#3E4346"/><rect y="14" width="14" height="7" fill="#B0623A"/><rect y="21" width="21" height="7" fill="#3E4346"/></g>
        <rect x="35" y="0" width="14" height="7" fill="#3E4346"/><rect x="14" y="7" width="63" height="7" fill="#B0623A"/>
        <rect x="14" y="14" width="63" height="28" fill="#F2E9D8"/><rect x="7" y="21" width="7" height="14" fill="#B0623A"/>
        <rect x="77" y="21" width="7" height="14" fill="#B0623A"/><rect x="21" y="21" width="14" height="14" fill="#3E4346"/>
        <rect x="49" y="21" width="14" height="14" fill="#3E4346"/><rect x="33" y="21" width="7" height="7" fill="#FFFFFF"/>
        <rect x="54" y="21" width="7" height="7" fill="#FFFFFF"/><rect x="14" y="28" width="7" height="7" fill="#E0A096"/>
        <rect x="70" y="28" width="7" height="7" fill="#E0A096"/><rect x="35" y="38" width="14" height="5" fill="#3E4346"/>
        <rect x="28" y="42" width="35" height="7" fill="#3E4346"/><rect x="14" y="49" width="63" height="28" fill="#B0623A"/>
        <rect x="63" y="56" width="7" height="7" fill="#3E4346"/>
        <g transform="translate(0,56)"><rect width="7" height="14" fill="#3E4346"/><rect y="14" width="7" height="7" fill="#B0623A"/></g>
        <g transform="translate(84,56)"><rect width="7" height="14" fill="#3E4346"/><rect y="14" width="7" height="7" fill="#B0623A"/></g>
        <!-- sweat drop -->
        <path d="M86 8 q6 8 0 12 q-6 -4 0 -12" fill="#7FB6D9"/>
      </svg>
    </div>
  </div>

  <!-- divider -->
  <div id="div">
    <div class="line"></div>
    <div class="chip">
      <svg width="26" height="28" viewBox="0 0 52 55"><g fill="#C5A253">
        <rect x="14.5" y="0" width="14.5" height="51" rx="7.25" transform="rotate(30.5 21.75 25.5)"/>
        <circle cx="41" cy="41.5" r="8.8"/>
      </g></svg>
      <span>add argens</span>
    </div>
  </div>

  <!-- AFTER -->
  <div id="after" class="panel">
    <div class="tex"></div>
    <div class="tag">after argens</div>
    <div class="cap">Runs the whole workflow, start to finish.</div>

    <div id="aftpath">
      <svg width="900" height="40" viewBox="0 0 900 40">
        <line x1="0" y1="20" x2="836" y2="20" stroke="#8F7437" stroke-width="6" stroke-dasharray="26 18" stroke-linecap="round"/>
        <path d="M836 6 L876 20 L836 34 Z" fill="#241B07"/>
      </svg>
    </div>

    <!-- open gate posts -->
    <div id="gate">
      <svg width="240" height="210" viewBox="0 0 240 210">
        <rect x="0" y="0" width="26" height="210" rx="6" fill="#8F7437"/>
        <rect x="214" y="0" width="26" height="210" rx="6" fill="#8F7437"/>
        <circle cx="13" cy="14" r="7" fill="#5C4A22"/>
        <circle cx="227" cy="14" r="7" fill="#5C4A22"/>
      </svg>
    </div>

    <!-- coins trail -->
    <div class="coin-t" style="left:160px; bottom:152px; width:34px; height:34px;"></div>
    <div class="coin-t" style="left:282px; bottom:166px; width:28px; height:28px;"></div>
    <div class="coin-t" style="left:392px; bottom:150px; width:24px; height:24px;"></div>

    <!-- mascot mid-stride past the gate -->
    <div class="masc" style="left:660px; bottom:127px;">
      <svg width="118" height="136" viewBox="0 0 91 105">
        <g transform="translate(15,77) rotate(-14)"><rect width="14" height="14" fill="#3E4346"/><rect y="14" width="14" height="7" fill="#B0623A"/><rect x="-7" y="21" width="21" height="7" fill="#3E4346"/></g>
        <g transform="translate(55,77) rotate(12)"><rect width="14" height="14" fill="#3E4346"/><rect y="14" width="14" height="7" fill="#B0623A"/><rect y="21" width="21" height="7" fill="#3E4346"/></g>
        <rect x="35" y="0" width="14" height="7" fill="#3E4346"/><rect x="14" y="7" width="63" height="7" fill="#B0623A"/>
        <rect x="14" y="14" width="63" height="28" fill="#F2E9D8"/><rect x="7" y="21" width="7" height="14" fill="#B0623A"/>
        <rect x="77" y="21" width="7" height="14" fill="#B0623A"/><rect x="21" y="21" width="14" height="14" fill="#3E4346"/>
        <rect x="49" y="21" width="14" height="14" fill="#3E4346"/><rect x="28" y="21" width="7" height="7" fill="#FFFFFF"/>
        <rect x="49" y="21" width="7" height="7" fill="#FFFFFF"/><rect x="14" y="28" width="7" height="7" fill="#E0A096"/>
        <rect x="70" y="28" width="7" height="7" fill="#E0A096"/>
        <rect x="31" y="38" width="29" height="7" fill="#3E4346"/>
        <rect x="28" y="42" width="35" height="7" fill="#3E4346"/><rect x="14" y="49" width="63" height="28" fill="#B0623A"/>
        <rect x="63" y="56" width="7" height="7" fill="#3E4346"/>
        <g transform="translate(0,56)"><rect width="7" height="14" fill="#3E4346"/><rect y="14" width="7" height="7" fill="#B0623A"/></g>
        <g transform="translate(84,52) rotate(-30)"><rect width="7" height="14" fill="#3E4346"/><rect y="14" width="7" height="7" fill="#B0623A"/></g>
      </svg>
    </div>
  </div>

  <svg id="grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="59"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1350" filter="url(#n)" opacity="0.045"/>
  </svg>
</body>
</html>
