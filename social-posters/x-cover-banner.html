<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; overflow:hidden; background:#0C0B0A; }
  body { font-family:"DM Sans",sans-serif; position:relative; }

  #tex { position:absolute; inset:0;
    background-image: radial-gradient(rgba(64,60,56,0.4) 1.2px, transparent 1.2px);
    background-size: 44px 44px; }
  #glow { position:absolute; right:-160px; top:-180px; width:900px; height:760px; border-radius:50%;
    background: radial-gradient(ellipse, rgba(197,162,83,0.13) 0%, rgba(197,162,83,0) 62%); }
  #glow2 { position:absolute; left:-220px; bottom:-300px; width:760px; height:600px; border-radius:50%;
    background: radial-gradient(ellipse, rgba(237,233,227,0.045) 0%, rgba(237,233,227,0) 60%); }

  /* giant watermark mark behind mascot scene */
  #wmark { position:absolute; right:-50px; top:-90px; opacity:0.05; }

  /* ---- left text block ---- */
  #brand { position:absolute; left:120px; top:152px; display:flex; align-items:center; gap:18px; }
  #brand .nm { font-size:64px; font-weight:700; letter-spacing:-0.03em; color:#EDE9E3; }
  #brand .nm .dot { color:#C5A253; }
  #tag { position:absolute; left:120px; top:252px; font-size:48px; font-weight:600;
    letter-spacing:-0.01em; color:#EDE9E3; }
  #tag .g { color:#C5A253; }
  #chips { position:absolute; left:120px; top:350px; display:flex; gap:14px; }
  .chip { font-family:"JetBrains Mono",monospace; font-size:17px; letter-spacing:0.14em;
    color:#8F8881; border:2px solid #2A2724; border-radius:999px; padding:9px 20px; }
  .chip.g { color:#C5A253; border-color:#3A2E15; }

  /* ---- right scene ---- */
  #ground { position:absolute; left:0; top:0; }
  #masc { position:absolute; left:1180px; top:146px; }
  #cli { position:absolute; left:948px; top:130px; background:#15130F; border:2.5px solid #2A2724;
    border-radius:999px; padding:10px 20px; font-family:"JetBrains Mono",monospace; font-size:16px;
    color:#B0A99F; letter-spacing:0.04em; box-shadow:0 14px 36px rgba(0,0,0,0.45); }
  #cli .d { color:#C5A253; }
  #cli .ok { color:#4D9B6A; }
  .think { position:absolute; border-radius:50%; background:#15130F; border:2.5px solid #2A2724; }

  .coin { position:absolute; border-radius:50%; background:#F0E0AC; border:4px solid #B59243;
    font-family:"JetBrains Mono",monospace; font-weight:600; color:#8F7437;
    display:flex; align-items:center; justify-content:center; }

  #site { position:absolute; right:64px; top:48px; font-family:"JetBrains Mono",monospace;
    font-size:21px; letter-spacing:0.1em; color:#706B65; }

  .sp { position:absolute; }
  #grain { position:absolute; inset:0; z-index:9; pointer-events:none; }
</style>
</head>
<body>
  <div id="tex"></div>
  <div id="glow"></div>
  <div id="glow2"></div>

  <div id="wmark">
    <svg width="640" height="680" viewBox="0 0 52 55"><g fill="none" stroke="#C5A253" stroke-width="1.2">
      <rect x="14.5" y="0" width="14.5" height="51" rx="7.25" transform="rotate(30.5 21.75 25.5)"/>
      <circle cx="41" cy="41.5" r="8.8"/>
    </g></svg>
  </div>

  <!-- wordmark -->
  <div id="brand">
    <svg width="48" height="51" viewBox="0 0 52 55"><g fill="#C5A253">
      <rect x="14.5" y="0" width="14.5" height="51" rx="7.25" transform="rotate(30.5 21.75 25.5)"/>
      <circle cx="41" cy="41.5" r="8.8"/>
    </g></svg>
    <div class="nm">argens<span class="dot">.</span></div>
  </div>

  <div id="tag">Make agents <span class="g">pay.</span></div>

  <div id="chips">
    <div class="chip g">USDC</div>
    <div class="chip">STELLAR MAINNET</div>
    <div class="chip">80+ SERVICES</div>
  </div>

  <!-- ground + trail -->
  <div id="ground">
    <svg width="1500" height="500" viewBox="0 0 1500 500">
      <line x1="868" y1="403" x2="1462" y2="403" stroke="#8F7437" stroke-width="5"
        stroke-dasharray="24 16" stroke-linecap="round" opacity="0.85"/>
    </svg>
  </div>

  <!-- coins left behind on the trail -->
  <div class="coin" style="left:1008px; top:368px; width:32px; height:32px; font-size:16px;">$</div>
  <div class="coin" style="left:1096px; top:378px; width:24px; height:24px; font-size:12px;">$</div>

  <!-- thought bubble from the mascot -->
  <div id="cli"><span class="d">$</span> POST /pay <span class="ok">✓ settled</span></div>
  <div class="think" style="left:1166px; top:202px; width:14px; height:14px;"></div>
  <div class="think" style="left:1196px; top:234px; width:9px; height:9px;"></div>

  <!-- mascot strolling, coin balanced on head -->
  <div id="masc">
    <svg width="136" height="260" viewBox="0 -75 91 180">
      <!-- coin on head -->
      <circle cx="45.5" cy="-36" r="34" fill="#F0E0AC" stroke="#B59243" stroke-width="5"/>
      <text x="45.5" y="-23" text-anchor="middle" font-family="JetBrains Mono" font-weight="600"
        font-size="38" fill="#8F7437">$</text>
      <ellipse cx="34" cy="-48" rx="11" ry="6" fill="rgba(255,250,230,0.65)" transform="rotate(-28 34 -48)"/>
      <!-- motion dashes -->
      <g stroke="#C5A253" stroke-width="5" stroke-linecap="round" opacity="0.55">
        <line x1="-38" y1="22" x2="-12" y2="22"/>
        <line x1="-30" y1="44" x2="-8" y2="44"/>
      </g>
      <!-- legs mid-stride -->
      <g transform="translate(15,77) rotate(-14)"><rect width="14" height="14" fill="#3E4346"/><rect y="14" width="14" height="7" fill="#B0623A"/><rect x="-7" y="21" width="21" height="7" fill="#3E4346"/></g>
      <g transform="translate(55,77) rotate(12)"><rect width="14" height="14" fill="#3E4346"/><rect y="14" width="14" height="7" fill="#B0623A"/><rect y="21" width="21" height="7" fill="#3E4346"/></g>
      <!-- antenna + head -->
      <rect x="35" y="0" width="14" height="7" fill="#3E4346"/><rect x="14" y="7" width="63" height="7" fill="#B0623A"/>
      <rect x="14" y="14" width="63" height="28" fill="#F2E9D8"/><rect x="7" y="21" width="7" height="14" fill="#B0623A"/>
      <rect x="77" y="21" width="7" height="14" fill="#B0623A"/>
      <!-- eyes looking ahead -->
      <rect x="21" y="21" width="14" height="14" fill="#3E4346"/>
      <rect x="49" y="21" width="14" height="14" fill="#3E4346"/>
      <rect x="28" y="21" width="7" height="7" fill="#FFFFFF"/>
      <rect x="56" y="21" width="7" height="7" fill="#FFFFFF"/>
      <rect x="14" y="28" width="7" height="7" fill="#E0A096"/>
      <rect x="70" y="28" width="7" height="7" fill="#E0A096"/>
      <!-- smile -->
      <rect x="35" y="36" width="14" height="6" fill="#3E4346"/>
      <!-- body -->
      <rect x="28" y="42" width="35" height="7" fill="#3E4346"/><rect x="14" y="49" width="63" height="28" fill="#B0623A"/>
      <rect x="63" y="56" width="7" height="7" fill="#3E4346"/>
      <!-- arms: one swinging, one steadying the coin -->
      <g transform="translate(0,56)"><rect width="7" height="14" fill="#3E4346"/><rect y="14" width="7" height="7" fill="#B0623A"/></g>
      <g transform="translate(86,44) rotate(-150)"><rect width="7" height="14" fill="#3E4346"/><rect y="14" width="7" height="7" fill="#B0623A"/></g>
    </svg>
  </div>

  <!-- sparkles -->
  <div class="sp" style="left:1382px; top:124px;">
    <svg width="34" height="34" viewBox="0 0 56 56"><path d="M28 0 L33 23 L56 28 L33 33 L28 56 L23 33 L0 28 L23 23 Z" fill="#F4E1AE"/></svg>
  </div>
  <div class="sp" style="left:1408px; top:300px;">
    <svg width="18" height="18" viewBox="0 0 56 56"><path d="M28 0 L33 23 L56 28 L33 33 L28 56 L23 33 L0 28 L23 23 Z" fill="#EDE9E3" opacity="0.6"/></svg>
  </div>

  <div id="site">argens.xyz</div>

  <svg id="grain" width="1500" height="500">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="71"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1500" height="500" filter="url(#n)" opacity="0.05"/>
  </svg>
</body>
</html>
