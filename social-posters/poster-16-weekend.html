<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:#F2D9A6; }
  body { font-family:"DM Sans",sans-serif; position:relative; }

  /* ── warm afternoon sky ── */
  #sky { position:absolute; inset:0;
    background:
      radial-gradient(circle 460px at 78% 16%, rgba(255,244,208,0.95) 0%, rgba(255,238,190,0) 62%),
      linear-gradient(178deg, #FAE6BE 0%, #F6D9A8 34%, #F0C68C 64%, #E7AE71 88%, #DE9A61 100%); }
  #haze { position:absolute; left:0; right:0; bottom:300px; height:340px;
    background: linear-gradient(180deg, rgba(255,240,206,0) 0%, rgba(255,238,198,0.5) 100%); }

  /* ── copy ── */
  #kick { position:absolute; left:88px; top:128px; font-family:"JetBrains Mono",monospace;
    font-size:20px; letter-spacing:0.24em; text-transform:uppercase; color:#9A7433;
    display:flex; align-items:center; gap:0.66em; }
  #kick > svg { width:0.76em; height:0.82em; flex:none; }
  #kick > i { width:2.7em; height:2px; flex:none; background:currentColor; opacity:0.35; }
  #h1 { position:absolute; left:88px; top:180px; width:750px;
    font-size:86px; font-weight:700; letter-spacing:-0.035em; line-height:1.06; color:#3A2E15; }
  #h1 .r { color:#B0623A; }
  #sub { position:absolute; left:90px; top:472px; width:668px;
    font-size:31px; font-weight:500; line-height:1.5; color:#7A5F26; letter-spacing:-0.004em; }

  #wm { position:absolute; left:88px; bottom:78px; display:flex; align-items:center; gap:14px; z-index:6; }
  #wm .nm { font-size:36px; font-weight:700; letter-spacing:-0.03em; color:#F7EFDC; }
  #wm .nm .dot { color:#E8CC85; }

  #art { position:absolute; inset:0; }
  #grain { position:absolute; inset:0; z-index:9; pointer-events:none; }
</style>
</head>

    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="23"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1350" filter="url(#n)" opacity="0.045"/>
  </svg>
</body>
</html>
