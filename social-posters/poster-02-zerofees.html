<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:#0C0B0A; }
  body { font-family:"DM Sans",sans-serif; position:relative; }

  /* big-circle halftone field */
  #dots {
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle 86px at center, #141210 85px, transparent 86px),
      radial-gradient(circle 86px at center, #141210 85px, transparent 86px);
    background-size: 196px 196px, 196px 196px;
    background-position: 0 0, 98px 98px;
  }
  #vig {
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 42%, rgba(197,162,83,0.10) 0%, rgba(12,11,10,0) 58%);
  }

  /* corner rays */
  .ray { position:absolute; background:#C5A253; border-radius:3px; opacity:0.85; }

  /* hero number */
  #hero { position:absolute; left:0; right:0; top:230px; text-align:center; }
  #zero {
    display:inline-block;
    font-size:430px; font-weight:700; letter-spacing:-0.04em; line-height:0.95;
    background: linear-gradient(168deg, #F4E1AE 4%, #E8CC85 22%, #C5A253 46%, #8F7437 72%, #C5A253 92%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:
      drop-shadow(0 4px 0 #5C4A22)
      drop-shadow(0 5px 0 #4A3B1B)
      drop-shadow(0 7px 0 #3A2E15)
      drop-shadow(0 28px 44px rgba(0,0,0,0.65));
    transform: rotate(-3deg);
  }

  /* sparkles */
  .sp { position:absolute; }
  .sp svg { display:block; }

  /* copy */
  #copy { position:absolute; left:0; right:0; top:818px; text-align:center; }
  #l1 { font-size:74px; font-weight:700; letter-spacing:-0.02em; color:#EDE9E3; }
  #l2 { margin-top:22px; font-size:40px; font-weight:500; color:#B0A99F; letter-spacing:-0.01em; }
  #l3 {
    margin-top:64px; display:inline-block;
    font-family:"JetBrains Mono",monospace; font-size:23px; letter-spacing:0.14em;
    text-transform:uppercase; color:#C5A253;
    border:2px solid #34302B; border-radius:999px; padding:18px 38px;
    background:#131210;
  }

  /* brand chevron bottom */
  #mark { position:absolute; left:50%; bottom:84px; transform:translateX(-50%); }

  /* confetti */
  .cf { position:absolute; border-radius:3px; }

  #grain { position:absolute; inset:0; z-index:9; pointer-events:none; }
</style>
</head>
<body>
  <div id="dots"></div>
  <div id="vig"></div>

  <div class="ray" style="left:108px; top:150px; width:54px; height:7px; transform:rotate(38deg)"></div>
  <div class="ray" style="left:74px; top:208px; width:38px; height:6px; transform:rotate(18deg)"></div>
  <div class="ray" style="right:96px; top:172px; width:54px; height:7px; transform:rotate(-34deg)"></div>
  <div class="ray" style="right:140px; top:118px; width:34px; height:6px; transform:rotate(-58deg)"></div>
  <div class="ray" style="left:140px; bottom:300px; width:42px; height:6px; transform:rotate(-24deg); background:#EDE9E3; opacity:0.5"></div>
  <div class="ray" style="right:120px; bottom:340px; width:48px; height:7px; transform:rotate(26deg)"></div>

  <div id="hero"><span id="zero">$0</span></div>

  <div class="sp" style="left:172px; top:262px;">
    <svg width="56" height="56" viewBox="0 0 56 56"><path d="M28 0 L33 23 L56 28 L33 33 L28 56 L23 33 L0 28 L23 23 Z" fill="#F4E1AE"/></svg>
  </div>
  <div class="sp" style="right:150px; top:486px;">
    <svg width="42" height="42" viewBox="0 0 56 56"><path d="M28 0 L33 23 L56 28 L33 33 L28 56 L23 33 L0 28 L23 23 Z" fill="#C5A253"/></svg>
  </div>
  <div class="sp" style="right:288px; top:212px;">
    <svg width="26" height="26" viewBox="0 0 56 56"><path d="M28 0 L33 23 L56 28 L33 33 L28 56 L23 33 L0 28 L23 23 Z" fill="#EDE9E3" opacity="0.8"/></svg>
  </div>
  <div class="sp" style="left:230px; top:640px;">
    <svg width="22" height="22" viewBox="0 0 56 56"><path d="M28 0 L33 23 L56 28 L33 33 L28 56 L23 33 L0 28 L23 23 Z" fill="#C5A253" opacity="0.9"/></svg>
  </div>

  <div id="copy">
    <div id="l1">Zero fees.</div>
    <div id="l2">On every direct USDC transfer your agent makes.</div>
    <div id="l3">usdc on stellar · settled in seconds</div>
  </div>

  <div class="cf" style="left:330px; bottom:200px; width:26px; height:8px; background:#C5A253; transform:rotate(31deg)"></div>
  <div class="cf" style="right:300px; bottom:170px; width:22px; height:7px; background:#4D9B6A; transform:rotate(-22deg)"></div>
  <div class="cf" style="right:410px; bottom:248px; width:18px; height:6px; background:#EDE9E3; opacity:0.6; transform:rotate(12deg)"></div>

  <div id="mark">
    <svg width="180" height="40" viewBox="0 0 180 40">
      <g transform="translate(0,3) scale(0.62)" fill="#C5A253">
        <rect x="14.5" y="0" width="14" height="50" rx="7" transform="rotate(30.5 21.5 25)"/>
        <circle cx="40" cy="40.5" r="8.6"/>
      </g>
      <text x="44" y="29" font-family="DM Sans" font-weight="600" font-size="26" fill="#EDE9E3">argens.</text>
    </svg>
  </div>

  <svg id="grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1350" filter="url(#n)" opacity="0.05"/>
  </svg>
</body>
</html>
