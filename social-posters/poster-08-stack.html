<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:#0C0B0A; }
  body { font-family:"Space Grotesk",sans-serif; position:relative; }
  #tex { position:absolute; inset:0;
    background-image: radial-gradient(rgba(64,60,56,0.45) 1.2px, transparent 1.2px);
    background-size: 48px 48px; }
  #glow { position:absolute; left:50%; top:64%; transform:translate(-50%,-50%);
    width:1000px; height:700px; border-radius:50%;
    background: radial-gradient(ellipse, rgba(197,162,83,0.16) 0%, rgba(197,162,83,0) 62%); }

  #kick { position:absolute; left:84px; top:96px; font-family:"JetBrains Mono",monospace;
    font-size:22px; letter-spacing:0.18em; text-transform:uppercase; color:#706B65; }
  #h1 { position:absolute; left:84px; top:148px; width:940px;
    font-size:74px; font-weight:700; letter-spacing:-0.028em; line-height:1.12; color:#EDE9E3; }
  #h1 .g { color:#C5A253; }
  #sub { position:absolute; left:84px; top:440px; width:840px;
    font-size:36px; font-weight:500; line-height:1.5; color:#B0A99F; }

  #stack { position:absolute; left:50%; top:610px; transform:translateX(-50%); }

  #wm { position:absolute; left:50%; bottom:78px; transform:translateX(-50%); }
  #grain { position:absolute; inset:0; z-index:9; pointer-events:none; }
</style>
</head>
<body>
  <div id="tex"></div>
  <div id="glow"></div>

  <div id="kick">// the missing layer</div>
  <div id="h1">Everyone built the agent. <span class="g">Nobody built the billing stack.</span></div>
  <div id="sub">Models, tools, memory — solved. The part where the agent pays for any of it? That's Argens.</div>

  <div id="stack">
    <svg width="840" height="595" viewBox="0 0 960 680">
      <!-- label chips -->
      <g font-family="JetBrains Mono" font-size="24" font-weight="600" letter-spacing="4">
        <g>
          <rect x="8" y="40" width="218" height="60" rx="30" fill="#1C1916" stroke="#403C38" stroke-width="2.5"/>
          <text x="36" y="78" fill="#B0A99F">MODEL</text>
          <text x="172" y="78" fill="#4D9B6A">✓</text>
          <line x1="226" y1="70" x2="396" y2="70" stroke="#403C38" stroke-width="2.5" stroke-dasharray="8 8"/>
        </g>
        <g>
          <rect x="8" y="168" width="218" height="60" rx="30" fill="#1C1916" stroke="#403C38" stroke-width="2.5"/>
          <text x="36" y="206" fill="#B0A99F">TOOLS</text>
          <text x="172" y="206" fill="#4D9B6A">✓</text>
          <line x1="226" y1="198" x2="396" y2="198" stroke="#403C38" stroke-width="2.5" stroke-dasharray="8 8"/>
        </g>
        <g>
          <rect x="8" y="296" width="218" height="60" rx="30" fill="#1C1916" stroke="#403C38" stroke-width="2.5"/>
          <text x="36" y="334" fill="#B0A99F">MEMORY</text>
          <text x="188" y="334" fill="#4D9B6A">✓</text>
          <line x1="226" y1="326" x2="396" y2="326" stroke="#403C38" stroke-width="2.5" stroke-dasharray="8 8"/>
        </g>
        <g>
          <rect x="8" y="470" width="252" height="60" rx="30" fill="#C5A253"/>
          <text x="36" y="508" fill="#241B07">PAYMENTS</text>
          <line x1="260" y1="500" x2="336" y2="500" stroke="#C5A253" stroke-width="3" stroke-dasharray="8 8"/>
        </g>
      </g>

      <!-- MODEL -->
      <g transform="translate(400,0)">
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="#2A2724"/>
        <path d="M0 70 L240 140 L240 218 L0 148 Z" fill="#1C1916"/>
        <path d="M240 140 L480 70 L480 148 L240 218 Z" fill="#15130F"/>
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="none" stroke="#403C38" stroke-width="2.5"/>
      </g>
      <!-- TOOLS -->
      <g transform="translate(400,128)">
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="#2A2724"/>
        <path d="M0 70 L240 140 L240 218 L0 148 Z" fill="#1C1916"/>
        <path d="M240 140 L480 70 L480 148 L240 218 Z" fill="#15130F"/>
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="none" stroke="#403C38" stroke-width="2.5"/>
      </g>
      <!-- MEMORY -->
      <g transform="translate(400,256)">
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="#2A2724"/>
        <path d="M0 70 L240 140 L240 218 L0 148 Z" fill="#1C1916"/>
        <path d="M240 140 L480 70 L480 148 L240 218 Z" fill="#15130F"/>
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="none" stroke="#403C38" stroke-width="2.5"/>
      </g>

      <!-- PAYMENTS — the gold layer sliding in -->
      <g transform="translate(340,430)">
        <!-- motion dashes -->
        <g stroke="#C5A253" stroke-width="6" stroke-linecap="round" opacity="0.7">
          <line x1="-178" y1="96" x2="-108" y2="96"/>
          <line x1="-150" y1="130" x2="-92" y2="130"/>
          <line x1="-190" y1="160" x2="-140" y2="160"/>
        </g>
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="#E0BD72"/>
        <path d="M0 70 L240 140 L240 218 L0 148 Z" fill="#A8853F"/>
        <path d="M240 140 L480 70 L480 148 L240 218 Z" fill="#8F7437"/>
        <path d="M0 70 L240 0 L480 70 L240 140 Z" fill="none" stroke="#F4E1AE" stroke-width="3"/>
        <ellipse cx="240" cy="58" rx="120" ry="30" fill="rgba(255,246,220,0.28)"/>
        <!-- brand mark on top face -->
        <g transform="translate(330,28) scale(0.55)" fill="#241B07">
          <rect x="14.5" y="0" width="14.5" height="51" rx="7.25" transform="rotate(30.5 21.75 25.5)"/>
          <circle cx="41" cy="41.5" r="8.8"/>
        </g>
      </g>

      <!-- sparkles -->
      <path d="M858 96 L863 117 L884 122 L863 127 L858 148 L853 127 L832 122 L853 117 Z" fill="#F4E1AE"/>
      <path d="M120 596 L124 612 L140 616 L124 620 L120 636 L116 620 L100 616 L116 612 Z" fill="#C5A253" opacity="0.9"/>
      <path d="M880 420 L883 432 L895 435 L883 438 L880 450 L877 438 L865 435 L877 432 Z" fill="#EDE9E3" opacity="0.7"/>
    </svg>
  </div>

  <div id="wm">
    <svg width="180" height="40" viewBox="0 0 180 40">
      <g transform="translate(0,3) scale(0.62)" fill="#C5A253">
        <rect x="14.5" y="0" width="14" height="50" rx="7" transform="rotate(30.5 21.5 25)"/>
        <circle cx="40" cy="40.5" r="8.6"/>
      </g>
      <text x="44" y="29" font-family="Space Grotesk" font-weight="600" font-size="26" fill="#EDE9E3">argens.</text>
    </svg>
  </div>

  <svg id="grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="31"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1350" filter="url(#n)" opacity="0.05"/>
  </svg>
</body>
</html>
