<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:#16357E; }
  body { font-family:"JetBrains Mono",monospace; position:relative; color:#E9F0FC; }
  #grid { position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(233,240,252,0.30) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(233,240,252,0.30) 1.5px, transparent 1.5px),
      linear-gradient(rgba(233,240,252,0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,240,252,0.12) 1px, transparent 1px);
    background-size: 160px 160px, 160px 160px, 40px 40px, 40px 40px; }
  #wash { position:absolute; inset:0;
    background:
      radial-gradient(ellipse 500px 360px at 18% 12%, rgba(233,240,252,0.07), transparent),
      radial-gradient(ellipse 420px 300px at 86% 78%, rgba(10,28,70,0.5), transparent),
      radial-gradient(ellipse 600px 460px at 50% 52%, rgba(233,240,252,0.05), transparent); }
  #frame { position:absolute; inset:34px; border:3px solid rgba(233,240,252,0.8); }
  #frame::after { content:""; position:absolute; inset:10px; border:1.5px solid rgba(233,240,252,0.45); }

  #h1 { position:absolute; left:104px; top:112px; width:800px;
    font-family:"Space Grotesk",sans-serif; font-size:84px; font-weight:700;
    letter-spacing:-0.025em; line-height:1.12; }
  #h1 .a { color:#9FBCF2; }
  #sub { position:absolute; left:104px; top:436px; font-size:28px; color:#9FBCF2; letter-spacing:0.04em; }

  #draw { position:absolute; left:50%; top:760px; transform:translate(-50%,-50%); }

  /* title block */
  #tb { position:absolute; right:60px; bottom:60px; width:430px;
    border:3px solid rgba(233,240,252,0.85); background:rgba(10,28,70,0.35); }
  #tb .r { display:flex; border-bottom:1.5px solid rgba(233,240,252,0.45); }
  #tb .r:last-child { border-bottom:none; }
  #tb .k { width:158px; padding:13px 16px; font-size:17px; letter-spacing:0.08em;
    color:#9FBCF2; border-right:1.5px solid rgba(233,240,252,0.45); text-transform:uppercase; }
  #tb .v { flex:1; padding:13px 16px; font-size:18px; color:#E9F0FC; }

  #stamp { position:absolute; left:96px; bottom:104px; transform:rotate(-7deg);
    border:4px solid rgba(233,240,252,0.9); border-radius:10px; padding:14px 24px;
    font-size:25px; font-weight:600; letter-spacing:0.22em; color:#E9F0FC; }

  #grain { position:absolute; inset:0; z-index:9; pointer-events:none; }
</style>
</head>
<body>
  <div id="grid"></div>
  <div id="wash"></div>
  <div id="frame"></div>

  <div id="h1">We hit this wall ourselves. <span class="a">So we drew the door.</span></div>
  <div id="sub">// built by agent builders, for agent builders</div>

  <div id="draw">
    <svg width="860" height="600" viewBox="0 0 860 600" fill="none" stroke="#E9F0FC">
      <!-- brand mark schematic, large -->
      <g transform="translate(280,60)" stroke-width="4">
        <rect x="86" y="10" width="92" height="330" rx="46" transform="rotate(30.5 132 175)"/>
        <circle cx="232" cy="262" r="56"/>
        <!-- centerlines -->
        <line x1="132" y1="-30" x2="132" y2="380" stroke-dasharray="20 10 4 10" stroke-width="1.6" opacity="0.65"/>
        <line x1="232" y1="186" x2="232" y2="338" stroke-dasharray="20 10 4 10" stroke-width="1.6" opacity="0.65"/>
        <line x1="156" y1="262" x2="308" y2="262" stroke-dasharray="20 10 4 10" stroke-width="1.6" opacity="0.65"/>
      </g>

      <!-- dimension: slash length -->
      <g stroke-width="2.2">
        <line x1="250" y1="40" x2="250" y2="420" stroke-dasharray="8 8" opacity="0.8"/>
        <line x1="238" y1="48" x2="262" y2="48"/>
        <line x1="238" y1="412" x2="262" y2="412"/>
      </g>
      <text x="200" y="240" fill="#E9F0FC" stroke="none" font-size="19" transform="rotate(-90 200 240)" letter-spacing="2">policy-enforced</text>

      <!-- dimension: circle -->
      <g stroke-width="2.2">
        <line x1="512" y1="392" x2="640" y2="470" stroke-dasharray="8 8" opacity="0.8"/>
      </g>
      <text x="648" y="486" fill="#E9F0FC" stroke="none" font-size="19" letter-spacing="2">Ø usdc · stellar</text>

      <!-- annotation: encrypted key -->
      <g stroke-width="2.2">
        <line x1="404" y1="120" x2="600" y2="70" stroke-dasharray="8 8" opacity="0.8"/>
        <circle cx="404" cy="120" r="5" fill="#E9F0FC"/>
      </g>
      <text x="608" y="64" fill="#E9F0FC" stroke="none" font-size="19" letter-spacing="2">aes-256 signing key</text>

      <!-- annotation: api -->
      <g stroke-width="2.2">
        <line x1="318" y1="330" x2="120" y2="396" stroke-dasharray="8 8" opacity="0.8"/>
        <circle cx="318" cy="330" r="5" fill="#E9F0FC"/>
      </g>
      <text x="36" y="424" fill="#E9F0FC" stroke="none" font-size="19" letter-spacing="2">POST /pay</text>

      <!-- corner crosses -->
      <g stroke-width="2.5" opacity="0.85">
        <path d="M30 30 h28 M44 16 v28"/>
        <path d="M802 30 h28 M816 16 v28"/>
        <path d="M30 560 h28 M44 546 v28"/>
        <path d="M802 560 h28 M816 546 v28"/>
      </g>
    </svg>
  </div>

  <div id="stamp">FIX: SHIPPED</div>

  <div id="tb">
    <div class="r"><div class="k">project</div><div class="v">ARGENS — payment layer</div></div>
    <div class="r"><div class="k">drawn by</div><div class="v">agent builders</div></div>
    <div class="r"><div class="k">for</div><div class="v">agent builders</div></div>
    <div class="r"><div class="k">rev</div><div class="v">mainnet · v1</div></div>
    <div class="r"><div class="k">sheet</div><div class="v">1 of 1 · argens.xyz</div></div>
  </div>

  <svg id="grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="61"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1350" filter="url(#n)" opacity="0.06"/>
  </svg>
</body>
</html>
