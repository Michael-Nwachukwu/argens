<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:#0C0B0A; }
  body { font-family:"DM Sans",sans-serif; position:relative; }
  #tex { position:absolute; inset:0;
    background-image: radial-gradient(rgba(64,60,56,0.38) 1.1px, transparent 1.1px);
    background-size: 46px 46px; }
  #glow { position:absolute; left:74%; top:74%; transform:translate(-50%,-50%);
    width:760px; height:620px; border-radius:50%;
    background: radial-gradient(ellipse, rgba(197,162,83,0.20) 0%, rgba(197,162,83,0) 62%); }

  #kick { position:absolute; left:88px; top:112px; font-family:"JetBrains Mono",monospace;
    font-size:20px; letter-spacing:0.24em; text-transform:uppercase; color:#706B65;
    display:flex; align-items:center; gap:0.66em; }
  #kick > svg { width:0.76em; height:0.82em; flex:none; }
  #kick > i { width:2.7em; height:2px; flex:none; background:currentColor; opacity:0.35; }
  #h1 { position:absolute; left:88px; top:164px; width:900px;
    font-size:84px; font-weight:700; letter-spacing:-0.035em; line-height:1.06; color:#EDE9E3; }
  #h1 .g { color:#C5A253; }
  #sub { position:absolute; left:88px; top:412px; width:790px;
    font-size:29px; font-weight:400; line-height:1.55; color:#A79F94; }

  #wm { position:absolute; left:88px; bottom:78px; display:flex; align-items:center; gap:14px; }
  #wm .nm { font-size:34px; font-weight:700; letter-spacing:-0.03em; color:#EDE9E3; }
  #wm .nm .dot { color:#C5A253; }
  #art { position:absolute; inset:0; }
  #grain { position:absolute; inset:0; z-index:9; pointer-events:none; }
</style>
</head>
<body>
  <div id="tex"></div>
  <div id="glow"></div>

  <svg id="art" width="1080" height="1350" viewBox="0 0 1080 1350">
    <defs>
      <linearGradient id="cardG" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#221E19"/><stop offset="1" stop-color="#121009"/>
      </linearGradient>
      <radialGradient id="coinG" cx="0.36" cy="0.3" r="0.78">
        <stop offset="0" stop-color="#FFF9E4"/><stop offset="0.5" stop-color="#F0E0AC"/>
        <stop offset="1" stop-color="#C09A45"/>
      </radialGradient>
      <radialGradient id="coinHalo" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#F4E1AE" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#F4E1AE" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g transform="translate(0,-72)">
    <!-- baseline both objects stand on -->
    <line x1="88" y1="1060" x2="992" y2="1060" stroke="#2A2724" stroke-width="2.5"/>

    <!-- ══ the old floor: a heavy, inert card ══ -->
    <g transform="rotate(-6 350 910)">
      <rect x="115" y="762" width="470" height="296" rx="26" fill="#0A0806" opacity="0.7"
            transform="translate(6,10)"/>
      <rect x="115" y="762" width="470" height="296" rx="26" fill="url(#cardG)"
            stroke="#2E2A25" stroke-width="2.5"/>
      <!-- top sheen -->
      <path d="M 141 764 H 559 A 24 24 0 0 1 583 788 V 806 H 117 V 788 A 24 24 0 0 1 141 764 Z"
            fill="#FFFFFF" opacity="0.03"/>
      <!-- chip -->
      <rect x="155" y="828" width="66" height="50" rx="9" fill="#3A342C"/>
      <g stroke="#2A251F" stroke-width="2">
        <line x1="155" y1="853" x2="221" y2="853"/>
        <line x1="188" y1="828" x2="188" y2="878"/>
      </g>
      <!-- embossed number row -->
      <g fill="#2E2A25">
        <rect x="155" y="916" width="70" height="15" rx="4"/>
        <rect x="239" y="916" width="70" height="15" rx="4"/>
        <rect x="323" y="916" width="70" height="15" rx="4"/>
        <rect x="407" y="916" width="70" height="15" rx="4"/>
      </g>
      <text x="155" y="984" font-family="JetBrains Mono" font-size="17" letter-spacing="3"
            fill="#5A544C">MINIMUM CHARGE</text>
      <text x="155" y="1030" font-family="DM Sans" font-weight="700" font-size="48"
            letter-spacing="-0.02em" fill="#4A443C">$0.30</text>
    </g>

    <!-- ══ the new floor: one live payment ══ -->
    <circle cx="812" cy="1012" r="128" fill="url(#coinHalo)"/>
    <circle cx="812" cy="1012" r="47" fill="url(#coinG)" stroke="#B59243" stroke-width="4"/>
    <ellipse cx="798" cy="994" rx="15" ry="10" fill="rgba(255,253,244,0.7)" transform="rotate(-28 798 994)"/>
    <g transform="translate(795,992) scale(0.66)" fill="#8F7437">
      <rect x="14.5" y="0" width="14.5" height="51" rx="7.25" transform="rotate(30.5 21.75 25.5)"/>
      <circle cx="41" cy="41.5" r="8.8"/>
    </g>

    <!-- labels -->
    <text x="128" y="1118" font-family="JetBrains Mono" font-size="20" letter-spacing="2.4"
          fill="#706B65">what a card needs</text>
    <text x="812" y="1118" text-anchor="middle" font-family="DM Sans" font-weight="700"
          font-size="42" letter-spacing="-0.02em" fill="#C5A253">$0.004</text>
    <text x="812" y="1152" text-anchor="middle" font-family="JetBrains Mono" font-size="18"
          letter-spacing="2.2" fill="#706B65">what your agent spends</text>
    </g>
  </svg>

  <div id="kick"><svg viewBox="0 0 52 55" fill="#C5A253"><rect x="14.5" y="0" width="14.5" height="51" rx="7.25" transform="rotate(30.5 21.75 25.5)"/><circle cx="41" cy="41.5" r="8.8"/></svg><span>micropayments</span><i></i></div>
  <div id="h1">Too small to charge.<br/><span class="g">Just right to pay.</span></div>
  <div id="sub">Card rails have a floor, and agents live underneath it. On Argens four tenths of a cent settles exactly like four hundred dollars — same rail, same finality.</div>

  <div id="wm">
    <svg width="30" height="32" viewBox="0 0 52 55"><g fill="#C5A253">
      <rect x="14.5" y="0" width="14.5" height="51" rx="7.25" transform="rotate(30.5 21.75 25.5)"/>
      <circle cx="41" cy="41.5" r="8.8"/>
    </g></svg>
    <div class="nm">argens<span class="dot">.</span></div>
  </div>

  <svg id="grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="17"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1350" filter="url(#n)" opacity="0.05"/>
  </svg>
</body>
</html>
